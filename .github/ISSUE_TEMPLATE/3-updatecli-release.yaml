name: Updatecli Release
title: "Updatecli <VERSION> release"
description: Issue with all the items needed to release a new version of Updatecli
projects: ["updatecli/2"]
labels: ["release"]

body:
  - type: textarea
    attributes:
      label: Checklist
      description: Base checklist for the release process. Please, add or remove items as needed.
      value: |
        - [ ] Tag the version `git tag <VERSION> -s`, don't forget to add to the tag description the release note generated by release-drafter
        - [ ] Push the release tag `git push upstream tag <VERSION>`
        - [ ] Review Updatecli update pullrequest on [updatecli/updatecli-action](https://github.com/updatecli/updatecli-action/)
        - [ ] Release a new github action version
        - [ ] Review Updatecli update pullrequest on [updatecli/website](https://github.com/updatecli/website/) 

        [Udash should be all green(filtered on "release=updatecli" labels, "24h" window)](https://app.uda.sh/updatecli/scm/dashboard?filter=eyJkYXRlUmFuZ2UiOlswLDI0XSwic2VsZWN0ZWRMYWJlbHMiOlt7ImtleSI6InJlbGVhc2UiLCJ2YWx1ZSI6InVwZGF0ZWNsaSJ9XSwic2VsZWN0ZWRSZXN1bHRzIjpbXSwic2VsZWN0ZWRPcGVuQWN0aW9uIjpudWxsfQ)
