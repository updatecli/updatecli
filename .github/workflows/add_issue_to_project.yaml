name: Add issues to Updatecli project
on:
  issues:
    types:
      - opened
permissions: {}
jobs:
  add-to-project:
    name: Add issue to Updatecli project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/updatecli/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
