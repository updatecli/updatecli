---
name: Updatecli Test
on:
  pull_request:
permissions:
  contents: read
jobs:
  updatecli:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup updatecli"
        uses: "updatecli/updatecli-action@8aa7bec31d6463e47c947f06c6b1df7dba276e07" # v3.11.0
        with:
          version: "v0.124.0"
      - name: "Set up Go"
        uses: "actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5" # v7.1.0
        with:
          go-version-file: "go.mod"
          cache: false
        id: go
      - name: "Test updatecli in dry-run mode"
        run: "updatecli compose diff"
        env:
          # This step is executed in untrusted context. We use a token with minimal permissions.
          UPDATECLI_GITHUB_USERNAME: ${{ github.actor }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
