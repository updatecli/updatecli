name: "[jenkinsci/docker] Dockerfile autodiscovery using several version filters and groups"
pipelineid: e2e/autodiscovery/dockerfile/versionfilters
scms:
  jenkins-docker:
    kind: git
    spec:
      url: https://github.com/jenkinsci/docker.git
      branch: master

autodiscovery:
  scmid: jenkins-docker
  groupby: individual
  crawlers:
    dockerfile:
      digest: false
      # Each version filter gets its own pipelines.
      # The "major" ones wait while a "minor" update is pending for the same image.
      versionfilters:
        - name: minor
          kind: semver
          pattern: minor
        - name: major
          kind: semver
          pattern: majoronly
      # Matching images are updated together, in one pipeline per version filter.
      groups:
        - name: base
          only:
            - images:
                - "debian"
                - "alpine"
