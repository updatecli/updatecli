name: Default policies
values:
  - updatecli/values.d/scm.yaml

include:
  - updatecli/updatecli-compose.d/golang/major.yaml
  - updatecli/updatecli-compose.d/golang/minor.yaml
  - updatecli/updatecli-compose.d/golang/vulnerability.yaml

policies:
  - name: Local Updatecli Policies
    id: local
    config:
      - updatecli/updatecli.d/

  - name: Update Updatecli policies
    id: root_updatecli_policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    valuesinline:
      spec:
        files:
          - "updatecli-compose.yaml"
        only:
          - path: "updatecli-compose.yaml"
      pipeline:
        labels:
          ecosystem: updatecli
          monitor: active

  - name: Default Update Updatecli policies
    id: updatecli_policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.9.0@sha256:67026697434a99f6e01a662caa662e8ed02e39e8abf8f7399ab673d113abb360
    valuesinline:
      spec:
        rootdir: updatecli/updatecli-compose.d
        files:
          - "*.yaml"
          - "*.yml"
      pipeline:
        labels:
          ecosystem: updatecli
          monitor: active

  - name: Golang Version
    id: golang_version
    policy: ghcr.io/updatecli/policies/golang/version:0.9.0@sha256:4ebf4c09d559ba1dcdd64b6f5749b4e0d7e473adef2f4805f85bc1a0f0795aa6
    valuesinline:
      pipeline:
        labels:
          ecosystem: golang
          monitor: active

  - name: Update golangci-lint
    id: golangci-lint
    policy: ghcr.io/updatecli/policies/golangci-lint/githubaction:0.9.0@sha256:caccf9fe8fd42ffb113bf949cdf00f0bace80df1e59eadbd3cfcfbbfe5271161

  - name: Update Updatecli version in GitHub action
    id: updatecli_github_action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.10.0@sha256:666a807c7e1f260fa3d9357fd2b60c57f5dedbd6f29f97b6f82d882ed4058608
    valuesinline:
      spec:
        rootdir: ".github"
      pipeline:
        labels:
          release: updatecli
          monitor: active
          ecosystem: updatecli
          policy: gha

  - name: Update githubactions
    id: githubactions
    policy: ghcr.io/updatecli/policies/autodiscovery/githubaction:0.5.0@sha256:7dd97c132950994dc3fb89e0bc77037358e9168d8e6980705b2a06e444270626
    valuesinline:
      spec:
        rootdir: ".github"

  - name: Sync Updatecli workflows
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction/scaffold:0.2.0@sha256:abfecc050f1598f0ee835d673ddc06c89f71319c64672486e608d6f47f0d8987
    valuesinline:
      gha:
        golang:
          enabled: true
        udash:
          enabled: true
        update:
          cron: "0 3 * * *"
          matrix:
            - target_name: "existing pipelines"
              apply_args: "--existing-only=true"
            - target_name: "monitored pipelines"
              apply_args: "--labels=monitor:active"
      pipeline:
        labels:
          ecosystem: "updatecli"
          policy: scaffold
          monitor: active
