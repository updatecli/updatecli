name: Default policies
values:
  - updatecli/values.d/scm.yaml

include:
  - updatecli/updatecli-compose.d/golang/major.yaml
  - updatecli/updatecli-compose.d/golang/minor.yaml

policies:
  - name: Local Updatecli Policies
    id: local
    config:
      - updatecli/updatecli.d/

  - name: Update Updatecli policies
    id: root_updatecli_policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.8.1@sha256:f8edda1a6cbf0d7274e2b847ede29fc4dc70dd5302ccb8575ae21b069cc0d8a0
    valuesinline:
      spec:
        files:
          - "updatecli-compose.yaml"
        only:
          - path: "updatecli-compose.yaml"
      pipeline:
        labels:
          ecosystem: updatecli
          monitor: active

  - name: Default Update Updatecli policies
    id: updatecli_policies
    policy: ghcr.io/updatecli/policies/updatecli/autodiscovery:0.8.1@sha256:f8edda1a6cbf0d7274e2b847ede29fc4dc70dd5302ccb8575ae21b069cc0d8a0
    valuesinline:
      spec:
        rootdir: updatecli/updatecli-compose.d
        files:
          - "*.yaml"
          - "*.yml"
      pipeline:
        labels:
          ecosystem: updatecli
          monitor: active

  - name: Golang Version
    id: golang_version
    policy: ghcr.io/updatecli/policies/golang/version:0.8.0@sha256:5bd7aa9da3251bdb73e3001715acf76f40add7d4aa5a0fa0621b31bd8a3ccc0a
    valuesinline:
      pipeline:
        labels:
          ecosystem: golang
          monitor: active

  - name: Update golangci-lint
    id: golangci-lint
    policy: ghcr.io/updatecli/policies/golangci-lint/githubaction:0.8.1@sha256:7fb34ae17a84641f02c3ff2aa0f8156a7108f32f21282b0070b8883c86ba6e67

  - name: Update Updatecli version in GitHub action
    id: updatecli_github_action
    policy: ghcr.io/updatecli/policies/updatecli/githubaction:0.9.1@sha256:49c07d724474ff7976f7ad5ecb0db9aa46448b456d08f82717913b403a0f02d8
    valuesinline:
      spec:
        rootdir: ".github"
      pipeline:
        labels:
          release: updatecli
          monitor: active
          ecosystem: updatecli
          policy: gha

  - name: Update githubactions
    id: githubactions
    policy: ghcr.io/updatecli/policies/autodiscovery/githubaction:0.4.1@sha256:869b676074f9fee7edd5d488140a12c3b09a5f8a175f12f26ea85a4f8bd0a9d1
    valuesinline:
      spec:
        rootdir: ".github"

  - name: Sync Updatecli workflows
    id: updatecli
    policy: ghcr.io/updatecli/policies/updatecli/githubaction/scaffold:0.1.1@sha256:121dfef5a33bc5cad4eced09ae1fd2305319ce2fd6d23ff661b5c99d11d0d9d2
    valuesinline:
      gha:
        golang:
          enabled: true
        udash:
          enabled: true
        update:
          cron: "0 3 * * *"
          matrix:
            - target_name: "existing pipelines"
              apply_args: "--existing-only=true"
            - target_name: "monitored pipelines"
              apply_args: "--labels=monitor:active"
      pipeline:
        labels:
          ecosystem: "updatecli"
          policy: scaffold
          monitor: active
